# CI: lint, typecheck, test (with a real PostgreSQL for the database and API suites) and build, on every push and
# every pull request to main. Deployment is a separate workflow (deploy.yml) that only runs after this one passes on
# main.
name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    services:
      # Throwaway database for apps/server/test/db.test.js and api.test.js (the name must end in _test). It lives only
      # inside this job, so its password is not a secret.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pricepulse
          POSTGRES_PASSWORD: pricepulse
          POSTGRES_DB: pricepulse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pricepulse -d pricepulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pricepulse:pricepulse@localhost:5432/pricepulse_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Official download script, pinned version. Findings are written as annotations, so they show on the commit.
      - name: Check workflow syntax and expressions (actionlint)
        run: |
          curl --fail --silent --show-error --location -o download-actionlint.bash https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash
          bash download-actionlint.bash 1.7.7 > download.txt 2>&1 || { echo "::error::actionlint download failed: $(tr '\n' ' ' < download.txt | cut -c1-900)"; exit 1; }
          status=0
          ./actionlint -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}{{"\n"}}{{end}}' > findings.txt 2>&1 || status=$?
          cat findings.txt
          # A fatal error (exit 3) prints plain text rather than findings: surface it as one annotation.
          if [ "$status" -ne 0 ] && ! grep -q '^::error' findings.txt; then echo "::error::actionlint exit $status: $(tr '\n' ' ' < findings.txt | cut -c1-900)"; fi
          exit "$status"
