# Production deployment, gated on CI: runs only when the CI workflow finished successfully for a push to main.
# Pull requests and other branches never deploy.
#
# Backend: the Render deploy hook, pinned to the commit CI tested. The hook URL is the `production` environment
# secret RENDER_DEPLOY_HOOK_URL and is never printed; without it the job logs a notice and Render's auto-deploy is
# used instead.
# Frontend: deployed by Vercel's Git integration when main changes (apps/frontend, see docs/deployment.md).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One production deployment at a time, in commit order.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy the tested commit to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not set; Render's auto-deploy handles the backend."
            exit 0
          fi
          # The hook URL already carries its key as a query parameter; `ref` pins the deploy to the tested commit.
          curl --fail --silent --show-error --max-time 60 -X POST -o /dev/null "${RENDER_DEPLOY_HOOK_URL}&ref=${COMMIT}"
          echo "Render deploy of ${COMMIT} requested."

  smoke:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - name: Production API and site answer
        # A free Render instance may be asleep: allow for a cold start.
        run: |
          for _ in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 90 -H 'Accept: application/json' https://pricepulse-bgxj.onrender.com/api/health | grep -q '"ok":true'; then
              echo "API healthy."
              curl --fail --silent --show-error --max-time 30 -o /dev/null https://pricepulse-smoky.vercel.app/ && echo "Site up."
              exit 0
            fi
            sleep 20
          done
          echo "::error::The production API did not report healthy."
          exit 1
