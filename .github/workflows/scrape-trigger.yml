# Second trigger for the scheduled scrape, next to cron-job.org. cron-job.org gives up after 30 s and, while the free
# Render instance is asleep, receives Render's HTML loading page instead of the app. This call waits up to 3 minutes,
# long enough for a cold start. The server decides what is due, so a second call in the same hour only finds nothing
# due, or gets 409 while a run is going.
name: Scrape trigger

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: scrape-trigger
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: POST /api/scrape/run
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET is not set; cron-job.org is the only trigger."
            exit 0
          fi
          for attempt in 1 2 3; do
            code=$(curl -s -o response.json -w '%{http_code}' --max-time 180 -X POST \
              -H 'Accept: application/json' -H "Authorization: Bearer ${CRON_SECRET}" \
              https://pricepulse-bgxj.onrender.com/api/scrape/run || true)
            echo "attempt ${attempt}: HTTP ${code} $(head -c 300 response.json 2>/dev/null)"
            case "$code" in 202|409) exit 0 ;; esac
            sleep 30
          done
          echo "::error::The scrape trigger did not reach the API."
          exit 1
